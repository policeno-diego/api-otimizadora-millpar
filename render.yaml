services:
  - type: web
    name: api-otimizadora-millpar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FIREBASE_BASE_URL
        value: https://base-otimizadora-default-rtdb.firebaseio.com
      - key: SNAPSHOT_PATH
        value: snapshot
      - key: CACHE_SECONDS
        value: "10"
      - key: FIREBASE_VERIFY_SSL
        value: "true"
      - key: ALLOW_PUBLIC_READ
        value: "false"
      - key: API_TOKEN
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: AUTH_USERS_JSON
        sync: false
      - key: AUTH_TOKEN_TTL_HOURS
        value: "12"
